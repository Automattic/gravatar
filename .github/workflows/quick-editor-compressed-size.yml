name: Quick Editor Package Size

on:
  pull_request:
    paths:
      - 'web/packages/quick-editor/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quick-editor-compressed-size.yml'

permissions:
  contents: read
  pull-requests: write # Post the size comment

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          cwd: web/packages/quick-editor
          comment-key: quick-editor
