name: Gravatar Quick Editor Release & Publish to NPM

on: 
  workflow_dispatch:
    inputs:
      increment:
        type: choice
        description: 'Version type'
        required: true
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for NPM Trusted Publishing (OIDC)

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Git user
        run: |
          git config user.name "gravatar-automattic"
          git config user.email "gravatar@automattic.com"

      - name: Release
        working-directory: web/packages/quick-editor
        run: npx release-it ${{ github.event.inputs.increment }} --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
